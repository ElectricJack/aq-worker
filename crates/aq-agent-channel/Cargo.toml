[package]
name = "aq-agent-channel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Route-agnostic AQ forwarding: the per-attempt agent channel (spec 0006 §5) and the B6b loopback proxy."

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v5"] }
zeroize = "1"

[dev-dependencies]
aq-node-git = { path = "../aq-node-git", features = ["test-support", "environment-try"] }
axum.workspace = true
tempfile.workspace = true

[features]
# The `aq environment try` checkpoint (aq-server spec 0017 §6.2; aq-worker `project_environments`).
environment-try = []
