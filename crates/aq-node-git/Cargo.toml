[package]
name = "aq-node-git"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "A node's per-project git repository and per-attempt worktrees, fetched from and pushed to central aq-git (spec 0016 §5.3)"

[dependencies]
aq-worker-protocol = { workspace = true, features = ["native-git-author"] }
anyhow.workspace = true
fs2.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

axum = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
futures-util = "0.3"
tempfile.workspace = true

[features]
# The git HTTP double, for callers' tests.
test-support = ["dep:axum", "dep:futures-util", "dep:tempfile"]
# Fetches for aq-server spec 0017 environment jobs (aq-worker `project_environments`).
environment-job = []
# The `aq environment try` checkpoint (aq-server spec 0017 §6.2; aq-worker `project_environments`).
environment-try = []
