[package]
name = "aq-session-host"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux guarded tmux session host with independent expiring authority"
[dependencies]
aq-session-protocol = { path = "../aq-session-protocol", version = "=0.1.0" }
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
[dev-dependencies]
tempfile = "3"

[features]
test-support = []
