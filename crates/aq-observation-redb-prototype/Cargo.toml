[package]
name="aq-observation-redb-prototype"
version="0.0.4"
edition="2024"
publish=false
description="Isolated bounded transactional observation delivery experiment; no runtime adapter"
[dependencies]
reqwest={version="=0.12.28",default-features=false,features=["blocking","json","rustls-tls"]}
aq-observation-admission={path="../../vendor/aq-observation-admission-0.1.0",version="=0.1.0"}
aq-observation-engine={path="../aq-observation-engine",version="=0.0.1"}
redb="=4.4.0"
aq-observation={path="../aq-observation",version="=0.1.0"}
aq-lifecycle-protocol={path="../aq-lifecycle-protocol",version="=0.1.0"}
anyhow="1"
serde={version="1",features=["derive"]}
serde_json="1"
sha2="0.10"
uuid={version="1",features=["serde"]}
libc="0.2"
fs2="0.4"
[dev-dependencies]
tempfile="3"
