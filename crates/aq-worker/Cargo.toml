[package]
name = "aq-worker"
version = "0.5.1"
edition.workspace = true
publish.workspace = true

[dependencies]
aq-observation = { path = "../aq-observation", version = "=0.1.0" }
aq-observation-engine = { path = "../aq-observation-engine", version = "=0.0.1" }
aq-observation-redb-prototype = { path = "../aq-observation-redb-prototype", version = "=0.0.5" }
aq-admission-sandbox = { package = "aq-admission", path = "../../protocol/aq-admission", version = "=0.3.2" }
aq-agent-client = { path = "../aq-agent-client", version = "=0.1.0" }
aq-agent-channel = { path = "../aq-agent-channel", version = "=0.1.0" }
aq-machine-load = { path = "../aq-machine-load", version = "=0.1.0" }
aq-node-service = { path = "../aq-node-service", version = "=0.1.0" }
aq-handoff-note = { path = "../aq-handoff-note", version = "=0.1.0" }
aq-finite-responses = { path = "../aq-finite-responses", version = "=0.1.0" }
aq-lifecycle-protocol = { path = "../aq-lifecycle-protocol", version = "=0.1.0" }
aq-agent-result-local = { path = "../aq-agent-result-local", version = "=0.1.0" }
aq-responses-transport.workspace = true
aq-codex-mapper = { path = "../aq-codex-mapper", version = "=0.1.1" }
aq-terminal-relay = { path = "../../vendor/aq-terminal-relay-0.1.0", version = "=0.1.0" }
aq-terminal-renderer = { path = "../aq-terminal-renderer", version = "=0.1.0" }
aq-terminal-bridge = { path = "../aq-terminal-bridge", version = "=0.1.3" }
aq-terminal-relay-protocol = { path = "../../vendor/aq-terminal-relay-protocol-0.1.0", version = "=0.1.0" }
aq-phase-terminal-protocol = { path = "../../vendor/aq-phase-terminal-protocol-0.1.2", version = "=0.1.2" }
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
zeroize = "1"
aq-admission = { path = "../../vendor/aq-admission-0.1.12", version = "=0.1.12" }
aq-session-protocol.workspace = true
aq-session-host.workspace = true
aq-protocol.workspace = true
aq-worker-protocol.workspace = true
anyhow.workspace = true
clap.workspace = true
chrono.workspace = true
fs2.workspace = true
libc.workspace = true
rand.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
# Lets plain `cargo test` integration tests reach backend::conformance.
aq-worker = { path = ".", features = ["backend-conformance", "synthetic-runtime"] }
aq-responses-transport = { workspace = true, features = ["test-support"] }
aq-worker-protocol = { workspace = true, features = ["test-support"] }
axum.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
# Historical M2/M3 synthetic execution harness; never enabled by production builds.
synthetic-runtime = []
backend-conformance = ["aq-responses-transport/test-support"]
test-support = ["synthetic-runtime","backend-conformance", "aq-responses-transport/test-support","aq-terminal-bridge/test-support","aq-worker-protocol/test-support", "aq-session-host/test-support"]

[[bin]]
name = "aq-worker"
path = "src/bin/aq-worker/main.rs"

[[bin]]
name = "aq-worker-test-host"
path = "src/bin/aq-worker-test-host.rs"
required-features = ["test-support"]

[[bin]]
name = "native-prepare-smoke"
path = "src/bin/native-prepare-smoke.rs"
required-features = ["test-support"]

[[bin]]
name = "aq-b6b-user-probe"
path = "tests/support/b6b_user_probe.rs"
required-features = ["backend-conformance"]
