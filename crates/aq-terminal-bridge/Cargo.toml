[package]
name = "aq-terminal-bridge"
version = "0.1.1"
edition = "2024"
publish = false
description = "Finite guarded terminal input bridge; no launch or snapshot authority"

[dependencies]
aq-session-host = { path = "../aq-session-host", version = "=0.1.4" }
aq-session-protocol = { path = "../aq-session-protocol", version = "=0.1.0" }
aq-terminal-relay-protocol = { path = "../../vendor/aq-terminal-relay-protocol-0.1.0", version = "=0.1.0" }
aq-terminal-relay = { path = "../../vendor/aq-terminal-relay-0.1.0", version = "=0.1.0" }
anyhow = "1"
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["full"] }

[features]
test-support = ["aq-session-host/test-support"]

[[bin]]
name = "aq-terminal-bridge-test-host"
path = "src/bin/test-host.rs"
required-features = ["test-support"]
