[workspace]
resolver = "3"
members = ["protocol/aq-admission", "crates/aq-responses-transport", "crates/aq-codex-mapper", "crates/aq-agent-client", "crates/aq-agent-result-local", "crates/aq-observation-engine", "crates/aq-observation-redb-prototype", "crates/aq-observation", "crates/aq-lifecycle-protocol", "crates/aq-protocol", "crates/aq-session-protocol", "crates/aq-session-host", "crates/aq-terminal-bridge", "crates/aq-terminal-renderer", "crates/aq-worker-protocol", "crates/aq-worker"]

exclude = ["vendor/aq-admission-0.1.11", "vendor/aq-phase-terminal-protocol-0.1.2", "vendor/aq-admission-0.1.10", "vendor/aq-phase-terminal-protocol-0.1.1", "vendor/aq-phase-terminal-protocol-0.1.0", "vendor/aq-admission-0.1.9", "vendor/aq-admission-0.1.7", "vendor/aq-admission-0.1.6", "vendor/aq-agent-api-0.1.0", "vendor/aq-terminal-relay-protocol-0.1.0", "vendor/aq-terminal-relay-0.1.0", "vendor/aq-session-api-0.1.0"]

[patch.crates-io]
aq-admission = { path = "vendor/aq-admission-0.1.11" }
aq-lifecycle-protocol = { path = "crates/aq-lifecycle-protocol" }
aq-session-protocol = { path = "crates/aq-session-protocol" }
aq-session-api = { path = "vendor/aq-session-api-0.1.0" }
aq-terminal-relay-protocol = { path = "vendor/aq-terminal-relay-protocol-0.1.0" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
aq-agent-result-local = { path = "crates/aq-agent-result-local", version = "=0.1.0" }
aq-responses-transport = { path = "crates/aq-responses-transport", version = "=0.1.0" }
aq-session-host = { path = "crates/aq-session-host", version = "=0.1.5" }
aq-session-protocol = { path = "crates/aq-session-protocol", version = "=0.1.0" }
aq-protocol = { path = "crates/aq-protocol", version = "=0.1.0" }
aq-worker-protocol = { path = "crates/aq-worker-protocol", version = "=0.2.0" }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"

[profile.release]
lto = "thin"
strip = true

