[workspace]
resolver = "3"
members = ["protocol/aq-admission", "crates/aq-responses-transport", "crates/aq-codex-mapper", "crates/aq-agent-client", "crates/aq-agent-channel", "crates/aq-agent-result-local", "crates/aq-observation-engine", "crates/aq-observation-redb-prototype", "crates/aq-observation", "crates/aq-lifecycle-protocol", "crates/aq-protocol", "crates/aq-session-protocol", "crates/aq-session-host", "crates/aq-terminal-bridge", "crates/aq-terminal-renderer", "crates/aq-worker-protocol", "crates/aq-worker", "crates/aq-machine-load", "crates/aq-finite-responses", "crates/aq-handoff-note"]

exclude = [".aq", "vendor/aq-admission-0.1.12", "vendor/aq-phase-terminal-protocol-0.1.2", "vendor/aq-admission-0.1.10", "vendor/aq-phase-terminal-protocol-0.1.1", "vendor/aq-phase-terminal-protocol-0.1.0", "vendor/aq-admission-0.1.9", "vendor/aq-admission-0.1.7", "vendor/aq-admission-0.1.6", "vendor/aq-agent-api-0.1.0", "vendor/aq-terminal-relay-protocol-0.1.0", "vendor/aq-terminal-relay-0.1.0", "vendor/aq-session-api-0.1.0"]

[patch.crates-io]
aq-admission = { path = "vendor/aq-admission-0.1.12" }
aq-lifecycle-protocol = { path = "crates/aq-lifecycle-protocol" }
aq-session-protocol = { path = "crates/aq-session-protocol" }
aq-session-api = { path = "vendor/aq-session-api-0.1.0" }
aq-terminal-relay-protocol = { path = "vendor/aq-terminal-relay-protocol-0.1.0" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
aq-agent-result-local = { path = "crates/aq-agent-result-local", version = "=0.1.0" }
aq-responses-transport = { path = "crates/aq-responses-transport", version = "=0.1.0" }
aq-session-host = { path = "crates/aq-session-host", version = "=0.1.7" }
aq-session-protocol = { path = "crates/aq-session-protocol", version = "=0.1.0" }
aq-protocol = { path = "crates/aq-protocol", version = "=0.1.1" }
aq-worker-protocol = { path = "crates/aq-worker-protocol", version = "=0.2.0" }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"

# Bound target/ growth: full (debug = 2) DWARF made each test binary several
# hundred MB. Line tables keep file:line in backtraces for workspace code;
# third-party crates drop debuginfo. `[profile.test]` inherits these settings.
# Interactive edit/test loops are incremental: it is several times faster to
# rebuild after an edit, at the cost of gigabytes of target/incremental per
# checkout. CI and single-use sandboxes set CARGO_INCREMENTAL=0, which
# overrides this. See AGENTS.md "Build health".
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true

# CI-only images: no ThinLTO, low optimization. Release artifacts keep
# [profile.release]. (aq-server's Dockerfile.worker defines the same profile
# with --config for pinned sources that predate it.)
# Dropping ThinLTO alone saves nothing on a 4-vCPU runner (LTO builds
# dependencies as bitcode and generates code once); the optimization level is
# the lever (aq-server: 796 s release, 793 s without LTO, 445 s with workspace
# opt-level 0 and dependencies 1). Debug assertions stay off, as in release.
[profile.ci-image]
inherits = "release"
lto = false
opt-level = 0
codegen-units = 16

[profile.ci-image.package."*"]
opt-level = 1

